services:
  server:
    environment:
      EVEJS_COOP_EVENTS_FILE: /var/lib/evejs/coop-events.jsonl
      EVEJS_COOP_REQUIRE_TWO_PILOTS: '1'
      EVEJS_COOP_PARTY_RANGE_METERS: '250000'
      EVEJS_COOP_PARTY_NOTICES: '1'
      EVEJS_COOP_AGENT_DIALOGUE: '0'
      EVEJS_COOP_NPC_CHATTER: '0'
      EVEJS_COOP_FLEET_WARP_ARRIVAL: '1'
      EVEJS_COOP_MARKET_CATALOG: '1'
      EVEJS_COOP_VIRTUAL_WORLD: '1'
      # 30001363 Sobaseki is a real reciprocal-gate neighbour of Jita with SDE
      # belts: it gives the war layer a border whose two sides are both ARMED
      # factions (500011 Angel in Jita, 500020 Serpentis in Sobaseki), which the
      # ORE-owned systems 30000144/30000145 can never be (ORE flies no weapon).
      # FW-013A: Maurasi 30000140 is the only seeded-region system (region
      # 10000002) with real SDE belts AND a real reciprocal gate to Jita that is
      # not already owned by ORE. It is the border where two ARMED factions meet
      # inside a region that has real seeded buy orders.
      EVEJS_COOP_VIRTUAL_ROUTE: '30000142,30000144,30000145,30045344,30003837'
      EVEJS_COOP_VIRTUAL_POPULATION: '12'
      EVEJS_COOP_VIRTUAL_TRAVEL_MS: '120000'
      EVEJS_COOP_VIRTUAL_STATE_FILE: '/var/lib/evejs/coop-virtual-world.json'
      EVEJS_COOP_LIFE_FILE: '/var/lib/evejs/coop-npc-life.json'
      EVEJS_COOP_CLONE_RECOVERY_MS: '1800000'
      EVEJS_COOP_MATERIALIZE_NPCS: '1'
      # The materializer bridge accepts a per-system cap of 1..10. 26 made
      # createBridge() throw, so the bridge never existed and every
      # bridge-driven phase (raids, loot delivery, market) went silent.
      EVEJS_COOP_MATERIALIZE_LIMIT: '3'
      # Civilians spawn as ORE/CONCORD-owned hulls (white/blue), pirates stay red.
      EVEJS_COOP_NPC_ROLE_POOLS: '1'
      # Pirates do not warp away from a player who is on grid.
      EVEJS_COOP_NPC_ROUTE_HOLD: '1'
      EVEJS_COOP_VIRTUAL_ECONOMY: '1'
      EVEJS_COOP_ECONOMY_FILE: '/var/lib/evejs/coop-economy.json'
      EVEJS_COOP_FACTION_PATROLS: '1'
      # Project the authoritative war state into the client map + FW front tab.
      EVEJS_COOP_WAR_CLIENT_VIEW: '1'
      EVEJS_COOP_FW_ALL_SYSTEMS: '0'
      # Temporary: capture every service call shape so the faction-warfare window's
      # exact requests are measured instead of guessed.
      EVEJS_SERVICE_CALL_SHAPE_CAPTURE: '1'
      EVEJS_SERVICE_CALL_SHAPE_CAPTURE_PATH: '/var/lib/evejs/service-call-shapes.jsonl'
      EVEJS_COOP_FACTION_WAR: '1'
      EVEJS_COOP_FACTION_WAR_FLEETS: '1'
      EVEJS_COOP_FACTION_WAR_MOBILIZE: '1'
      # An assault attacker must really fly the gate into the contested system, otherwise
      # the front can never become a fight (owner default: enable what a real front needs).
      EVEJS_COOP_FACTION_WAR_GATE_APPROACH: '1'
      # FW-007B: the only sanctioned physical crossing. A staging order alone never
      # moves a hull between systems; this enables the proof-backed SQL+JSON handoff.
      EVEJS_COOP_FACTION_WAR_NATIVE_TRANSFER: '1'
      EVEJS_COOP_WAR_TRANSFER_JOURNAL_DIR: '/var/lib/evejs/coop-war-native-transfers'
      EVEJS_COOP_FACTION_WAR_COMBAT: '1'
      EVEJS_COOP_FACTION_WAR_NATIVE_CASUALTIES: '1'
      # FW-009B: durable war merit (and promotion) from a strictly proven kill.
      EVEJS_COOP_FACTION_WAR_MERIT: '1'
      # Owner decision 2026-10-27: the bounty escrow is an economic layer, not a
      # precondition for a real battle. 0 lets a front open with an explicitly
      # labelled PAPER_UNFUNDED_EXPLICIT supply (no ISK reserved, no bounty
      # payable) so the owner can join a real melee now. Default is 1.
      EVEJS_COOP_WAR_REQUIRE_FUNDING: '0'
      # FW-003D: a registered hull with no compatible charge left releases its
      # campaign slot (native RELEASE proof) so an armed hull can take it.
      EVEJS_COOP_FACTION_WAR_RELIEF: '1'
      # FW-003C ammo depth: a war patrol flies the authored multi-charge row
      # (real static row + real ammo depth) instead of one fitted charge.
      EVEJS_COOP_WAR_PATROL_LOADOUT_ROW: '1'
      EVEJS_COOP_WAR_PATROL_AMMO_DEPTH: '60'
      # FW-030: a mustered assault whose fleets sit AU apart warps the attacker to
      # the enemy it was mustered against, so the native 250 km firing envelope is
      # reachable at all. One real native warpToEntity, no teleport, no damage.
      EVEJS_COOP_WAR_ENGAGE_WARP: '1'
      # FW-031: a war hull beyond its belt leash was cleared home every think, so
      # its accepted attack order never became a target. Clear the leash and orbit
      # inside the real gun range via the native behaviour overrides.
      EVEJS_COOP_WAR_ENGAGEMENT_POSTURE: '1'
      # FW-032: a confirmed wreck must leave the war - release custody, record the
      # roster loss and free the pilot identity instead of keeping a dead hull.
      EVEJS_COOP_WAR_LOSS_RECONCILE: '1'
      # FW-033: refill a side of an active assault through the sanctioned
      # spawn_war_fleet path (real doctrine, real native hull, real free pilot).
      EVEJS_COOP_WAR_GARRISON: '1'
      # FW-035: a system flips military controller when its defending garrison is
      # really destroyed (verified wrecks + zero live defenders, sustained 60 s).
      EVEJS_COOP_WAR_CAPTURE_BY_FORCE: '1'
      # FW-034: the client's advantage panel (victory points + fw-advantage
      # gateway scores) derived from real wrecks and real hulls instead of an
      # empty state source that made the tab spin forever.
      EVEJS_COOP_WAR_ADVANTAGE: '1'
      EVEJS_COOP_FACTION_WAR_NATIVE_OBJECTIVES: '1'
      # FW-005A/B/C: the war chest is real money only. A faction's bounty is
      # funded from the earned ISK its own pilots really hold, escrowed in its
      # native corporation wallet, reserved BEFORE the campaign exists, and paid
      # out of that HELD escrow (no ISK is ever minted).
      EVEJS_COOP_WAR_TREASURY: '1'
      EVEJS_COOP_WAR_BOUNTY_ISK: '25000'
      # FW-011A: read-only war-control projection into the sovereignty view.
      EVEJS_COOP_WAR_SOVEREIGNTY_PROJECTION: '1'
      # Real native structure types a campaign may bind as its objective
      # (35832 Astrahus: the two faction 500014 keeps in Perimeter / New Caldari).
      EVEJS_COOP_WAR_OBJECTIVE_STRUCTURE_TYPE_IDS: '35832'
      EVEJS_COOP_FACTION_MILITIA_AGENT: '1'
      # Every faction whose SDE row carries a real militiaCorporationID and that
      # has agents docked at real stations: the four empires (Caldari 500001,
      # Minmatar 500002, Amarr 500003, Gallente 500004), Guristas 500010 and
      # Angel Cartel 500011. Serpentis 500020 and ORE 500014 have
      # militiaCorporationID null and can never recruit (see
      # docs/MILITIA_ENLISTMENT.md). The player's own faction, Caldari State
      # 500001 (character 140000005, raceID 1), is in this list.
      EVEJS_COOP_MILITIA_FACTION_IDS: '500001,500002,500003,500004,500010,500011'
      # In-process admin requests (deploy_structure) drained by coopAdminBridge.
      EVEJS_COOP_ADMIN_BRIDGE: '1'
      EVEJS_COOP_NPC_STRICT_AMMO: '1'
      EVEJS_COOP_NPC_AMMO_DURABLE_CYCLE: '1'
      EVEJS_COOP_NPC_BANK_ATOMIC: '1'
      EVEJS_COOP_NPC_BANK_OUTCOME_WITNESS: '1'
      # Agent-mission waves 2..N spawn with an empty triggerMessages list: announce the
      # real wave and cap the chain so a level-1 mission is not 24-67 hulls for 165k ISK.
      EVEJS_COOP_MISSION_WAVE_NOTIFY: '1'
      EVEJS_COOP_MISSION_WAVE_CAP: '3'
      EVEJS_COOP_NATIVE_MINING: '1'
      EVEJS_COOP_MINING_STARTUP_RETRY: '1'
      EVEJS_COOP_NATIVE_MINING_SLOT_RECONCILE: '1'
      EVEJS_COOP_NATIVE_STATION_TRIP_RECOVERY: '1'
      EVEJS_COOP_NATIVE_HAUL_MANIFEST: '1'
      EVEJS_COOP_CONVOY_RENEWAL: '1'
      EVEJS_COOP_NATIVE_HAUL_CARGO: '1'
      EVEJS_COOP_HAUL_CARGO_ADOPTION: '1'
      EVEJS_COOP_MINING_TRACE_PRUNE: '1'
      EVEJS_COOP_MINING_LOCK_GUARD: '1'
      EVEJS_COOP_NATIVE_MINING_CYCLE_CONSERVATION: '1'
      EVEJS_COOP_NATIVE_MINING_CARGO_INTEGRITY: '1'
      EVEJS_COOP_NATIVE_ATOMIC_ROWS: '1'
      EVEJS_COOP_NATIVE_MINING_CYCLE_ATOMIC: '1'
      EVEJS_COOP_NATIVE_CARGO_TRANSIENT_ISOLATION: '1'
      EVEJS_COOP_MINING_TRACE_CYCLE: '1'
      EVEJS_COOP_NATIVE_MINING_SLOT_SELFHEAL: '1'
      EVEJS_COOP_NATIVE_MINING_FLEET_DURABLE: '1'
      EVEJS_COOP_NATIVE_HAUL_TRANSFER_ATOMIC: '1'
      EVEJS_COOP_NPC_STATION_DELIVERY: '1'
      # Per-role hulls from the corporation's own wallet, and a miner that never
      # fills past one real hauler load (measured: 18 777 m3 waited for a 5 500 m3 hull).
      EVEJS_COOP_FLEET_COMPOSITION: '1'
      EVEJS_COOP_MINING_FILL_CAP: '1'
      # A stored cargo projection has no volume; the fleet cannot plan a haul without it.
      EVEJS_COOP_CARGO_VOLUME_FALLBACK: '1'
      # The native refinery existed with no caller; refined minerals are what the seed
      # market actually buys. Directory lives on the data volume.
      EVEJS_COOP_NPC_REFINERY: '1'
      EVEJS_COOP_NPC_REFINERY_DIR: '/var/lib/evejs/coop-native-refinery'
      EVEJS_COOP_NPC_MARKET_DIR: '/var/lib/evejs/coop-native-market'
      EVEJS_COOP_CORP_TREASURY: '1'
      EVEJS_COOP_FACTORY_CORP_ID: '1000129'
      EVEJS_COOP_ECONOMY_DESTINATION: '1'
      EVEJS_COOP_NATIVE_NPC_MARKET: '1'
      EVEJS_COOP_NPC_MARKET_SELL_ON_ARRIVAL: '1'
      # 444 = Mining Survey Chipset I, the product of blueprint 1076: a manufactured
      # good only sells when its type is on this operator policy list, because the
      # market allowlist is what stops a trader from liquidating arbitrary cargo.
      EVEJS_COOP_NPC_MARKET_SELL_TYPES: '1228,1230,17463,17464,17470,17471,211,180,185,216,219,241,243,244,182,2516,20767,4959,20617,11351,14272,25611,25606,34,35,36,37,38,39,40,444'

      EVEJS_COOP_NPC_MINERAL_LIFT: '1'

      EVEJS_COOP_NPC_MINERAL_LIFT_MAX_QTY: '100000'

      # Production follows real demand: measured 4.0M units stored against ~35k

      # still buyable in region 10000002. HOLD skips the fleet tick; TRICKLE keeps

      # one window per 15 minutes so the world never goes silent.

      EVEJS_COOP_MINING_DEMAND_GOVERNOR: '1'

      EVEJS_COOP_MINING_DEMAND_FACTOR: '1.5'

      EVEJS_COOP_MINING_DEMAND_FLOOR: '20000'

      EVEJS_COOP_MINING_DEMAND_TRICKLE_MS: '900000'
      EVEJS_COOP_NPC_MARKET_MAX_QTY: '20'
      EVEJS_COOP_NPC_MARKET_MAX_SELL_QTY: '100000'
      EVEJS_COOP_NPC_MARKET_MAX_PRICE: '50000000'
      EVEJS_COOP_NPC_MARKET_COOLDOWN_MS: '5000'
      EVEJS_COOP_NPC_SELL_PRICING: '1'
      EVEJS_COOP_NPC_WAREHOUSE_DIR: '/var/lib/evejs/coop-native-warehouse'
      EVEJS_COOP_ALIFE: '1'
      EVEJS_COOP_ALIFE_NEWS: '1'
      EVEJS_COOP_ALIFE_TRACE: '1'
      EVEJS_COOP_MINING_TRACE: '1'
      # A miner stranded at the off-grid warp origin must really warp back to its
      # rock: a subwarp follow order can never cross 2-4 AU (measured 4.5e11 m).
      EVEJS_COOP_MINING_BELT_RETURN: '1'
      # A live station trip keeps its hauler, and a stalled one is re-flown with the
      # same native warp instead of waiting out the deadline.
      EVEJS_COOP_MINING_TRIP_RETREAT_GUARD: '1'
      EVEJS_COOP_NATIVE_STATION_REWARP: '1'
      EVEJS_COOP_MINING_BELT_RETURN_METERS: '100000'
      EVEJS_COOP_NPC_CAPACITOR: '1'
      EVEJS_COOP_DEPOT_FILE: '/var/lib/evejs/coop-native-depot.json'
      EVEJS_COOP_HAULER_HOLD_MS: '45000'
      EVEJS_COOP_NPC_RAIDS: '1'
      EVEJS_COOP_NPC_RAID_HOME_ANCHOR: '1'
      # FW-017: a raider fits and engages a real warp point on its prey, so the
      # stock fleet retreat cannot warp the fight 2.5 AU apart mid-engagement.
      EVEJS_COOP_NPC_WARP_POINT: '1'
      EVEJS_COOP_NATIVE_TACTICS: '1'
      EVEJS_COOP_RIVAL_NPC_COMBAT: '1'
      EVEJS_COOP_FLEET_WARP_SAFETY: '1'
      EVEJS_COOP_FLEET_TRADE_SAFETY: '1'
      EVEJS_COOP_FLEET_MISSION_TURNIN: '0'
      EVEJS_SKILL_TRAINING_SPEED: '90'
      EVEJS_COOP_NATIVE_GATE_APPROACH: '1'
      EVEJS_COOP_NATIVE_GATE_TRANSFER: '1'
      EVEJS_COOP_MANUFACTURING_TIME_MULTIPLIER: '0.35'
      EVEJS_OMEGA_LICENSE: 'true'
      EVEJS_COOP_FLEET_MISSION_SHARE: '1'
      EVEJS_COOP_NATIVE_WEAPON_EVIDENCE: '1'
      EVEJS_COOP_PLAYER_DAMAGE_EVIDENCE: '1'
      # Real self-defence: an NPC that is shot answers, and nearby allies join in.
      # Authorization still requires a verified native session or damage witness.
      EVEJS_COOP_PVE_NPC_RETALIATION: '1'
      EVEJS_COOP_NATIVE_LOOT_EVIDENCE: '1'
      # FW-005C: a hull that really earned a wreck may sell what it recovered.
      EVEJS_COOP_NPC_LOOT_COMMERCE: '1'
      EVEJS_COOP_NPC_WRECK_TRANSFER: '1'
      EVEJS_COOP_NPC_WRECK_RECOVERY: '1'
      EVEJS_COOP_NPC_LOOT_SELL_ROLES: 'pirate,patrol'
      EVEJS_COOP_NATIVE_LOOT_QUARANTINE: '1'
      EVEJS_COOP_NATIVE_LOOT_QUARANTINE_FILE: '/var/lib/evejs/coop-native-loot-quarantine.json'
      EVEJS_COOP_HEADLESS_WORLD_BOOT: '1'
      EVEJS_COOP_DURABLE_NPC_SHIPS: '1'
      # A durable hull that really relocated leaves a stale link; reconcile it.
      EVEJS_COOP_DURABLE_RELOCATE_RESTORE: '1'
      EVEJS_COOP_FACTION_LAYOUT_V2: '1'
      EVEJS_COOP_LOCAL_INTEL: '1'
      EVEJS_COOP_PLAYER_CONSEQUENCES: '1'
      EVEJS_COOP_NPC_MEMORY: '1'
      EVEJS_COOP_NPC_MEMORY_FILE: '/var/lib/evejs/coop-npc-memory.json'
      EVEJS_COOP_STANDINGS_FILE: '/var/lib/evejs/coop-player-consequences.json'
      EVEJS_MINING_NPC_STANDINGS_ENABLED: 'true'
      EVEJS_MINING_NPC_NEUTRAL_RESPONSE_COUNT: '2'
      EVEJS_MINING_NPC_HOSTILE_RESPONSE_COUNT: '4'
      EVEJS_MINING_NPC_FRIENDLY_RESPONSE_COUNT: '0'
      EVEJS_MINING_NPC_STARTUP_ENABLED: 'true'
      EVEJS_MINING_NPC_STARTUP_SYSTEM_IDS: '30000144,30000145,30100032'
      # 2026-10-27: slot 30000145-1 is stuck in ALIFE08_REPAIR_SPAWN_COUNT_MISMATCH,

      # so New Caldari had no fleet at all. A second startup slot adds a fresh fleet

      # without deleting or rewriting the broken one.

      EVEJS_MINING_NPC_STARTUP_FLEET_COUNT: '2'
      EVEJS_MINING_NPC_STARTUP_FLEET_MINER_COUNT: '2'
      EVEJS_MINING_NPC_STARTUP_FLEET_HAULER_COUNT: '1'
      EVEJS_MINING_NPC_FLEET_AUTO_MINE_ENABLED: 'true'
      EVEJS_MINING_NPC_HAULER_INITIAL_DELAY_MS: '180000'
      EVEJS_MINING_NPC_HAULER_REPEAT_DELAY_MS: '45000'
      EVEJS_MINING_NPC_HAUL_THRESHOLD_RATIO: '0.1'
      # Test-time compression (real native knobs, same product code).
      EVEJS_MINING_NPC_WARP_INGRESS_DURATION_MS: '1500'
      EVEJS_MINING_NPC_FLEET_THINK_INTERVAL_MS: '5000'
      EVEJS_MINING_NPC_FLEET_AUTO_RESUME_DELAY_MS: '120000'
      EVEJS_MINING_NPC_RESPONSE_DEFAULT_COUNT: '2'
